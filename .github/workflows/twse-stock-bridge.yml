name: TWSE Stock Bridge

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'stock_bridge/**'
      - '.github/workflows/twse-stock-bridge.yml'
  schedule:
    # GitHub cron is UTC. These correspond to 09:20, 10:20, 11:20 Asia/Taipei.
    - cron: '20 1,2,3 * * 1-5'

permissions:
  contents: write

concurrency:
  group: twse-stock-bridge
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Self test
        run: python stock_bridge/bridge.py --self-test

      # Intentionally run the real TWSE build on pull_request as an integration test.
      # PR runs never commit generated data; only main schedule/dispatch runs may commit.
      - name: Build latest market data
        run: python stock_bridge/bridge.py

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('stock_bridge/latest.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['schema_version'] == '1.0'
          assert set(data['quotes']) == {'2002', '3019'}
          assert set(data['history']) == {'2002', '3019'}
          assert data['generated_at'] is not None
          print('JSON_VALIDATION_PASS')
          print('bridge=', data.get('bridge'))
          print('quote_2002=', data['quotes']['2002'].get('status'))
          print('quote_3019=', data['quotes']['3019'].get('status'))
          print('history_2002_count=', data['history']['2002'].get('count'))
          print('history_3019_count=', data['history']['3019'].get('count'))
          PY

      - name: Commit refreshed data
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stock_bridge/latest.json stock_bridge/history/*.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'data: refresh TWSE stock bridge'
          git push
