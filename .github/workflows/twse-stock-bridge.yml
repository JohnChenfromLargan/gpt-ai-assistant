name: TWSE Stock Bridge

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'stock_bridge/**'
      - '.github/workflows/twse-stock-bridge.yml'
  schedule:
    # GitHub cron is UTC. These correspond to 09:20, 10:20, 11:20 Asia/Taipei.
    - cron: '20 1,2,3 * * 1-5'

permissions:
  contents: write

concurrency:
  group: twse-stock-bridge
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Self tests
        run: |
          python stock_bridge/bridge.py --self-test
          python stock_bridge/phase2.py --self-test

      # Run the real TWSE integration on PRs too. PR runs never commit generated data.
      - name: Build Phase 1 market data
        run: python stock_bridge/bridge.py

      - name: Build Phase 2 analytics
        run: python stock_bridge/phase2.py

      - name: Validate generated JSON and analytics gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('stock_bridge/latest.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['schema_version'] == '2.0'
          assert set(data['quotes']) == {'2002', '3019'}
          assert set(data['history']) == {'2002', '3019'}
          assert set(data['analytics']) == {'2002', '3019'}
          assert data['generated_at'] is not None
          assert data['bridge']['transport_ready'] is True
          assert data['bridge']['analysis_ready'] is True
          for symbol in ('2002', '3019'):
              h = data['history'][symbol]
              a = data['analytics'][symbol]
              assert h['count'] >= 750
              assert h['history_gate'] == 'PASS'
              assert h['long_term_750_ready'] is True
              assert a['analysis_ready'] is True
              assert a['corporate_actions']['status'] == 'PASS'
              t = a['technical_completed_day']
              for key in ('ma20','ma60','ma120','ma240','rsi14','macd','macd_signal','atr14'):
                  assert t[key] is not None, (symbol, key)
              assert a['horizon_statistics']['240']['samples'] > 0
          print('PHASE2_JSON_VALIDATION_PASS')
          print('bridge=', data.get('bridge'))
          print('quotes=', {k: v.get('status') for k,v in data['quotes'].items()})
          print('history_counts=', {k: v.get('count') for k,v in data['history'].items()})
          print('corporate_actions=', {k: v['corporate_actions']['event_count'] for k,v in data['analytics'].items()})
          PY

      - name: Commit refreshed data
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stock_bridge/latest.json stock_bridge/history/*.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'data: refresh TWSE stock bridge'
          git push
