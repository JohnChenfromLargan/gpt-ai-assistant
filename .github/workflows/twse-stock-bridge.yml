name: TWSE Stock Bridge Source CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'stock_bridge/bridge.py'
      - 'stock_bridge/bridge_quote_layer.py'
      - 'stock_bridge/bridge_quote_layer_v2.py'
      - 'stock_bridge/phase2.py'
      - 'stock_bridge/phase2_fixed.py'
      - 'stock_bridge/README.md'
      - '.github/workflows/twse-stock-bridge.yml'
  pull_request:
    paths:
      - 'stock_bridge/**'
      - '.github/workflows/twse-stock-bridge.yml'

# Production publishing is owned by the non-fork repository
# JohnChenfromLargan/desktop-tutorial. This workflow validates source only.
permissions:
  contents: read

concurrency:
  group: twse-stock-bridge-source-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Self tests
        run: |
          python stock_bridge/bridge.py --self-test
          python stock_bridge/bridge_quote_layer.py --self-test
          python stock_bridge/bridge_quote_layer_v2.py --self-test
          python stock_bridge/phase2_fixed.py --self-test

      - name: Corporate action source smoke
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json, urllib.request
          url = 'https://www.twse.com.tw/rwd/zh/exRight/TWT49U?startDate=20260724&endDate=20260724&response=json'
          req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*'})
          with urllib.request.urlopen(req, timeout=30) as resp:
              data = json.loads(resp.read().decode('utf-8-sig'))
          fields = data.get('fields') or []
          rows = data.get('data') or []
          code_idx = fields.index('股票代號') if '股票代號' in fields else None
          hits = [r for r in rows if code_idx is not None and str(r[code_idx]).strip() == '2002']
          assert hits, 'TWSE corporate-action smoke failed: 2002 not found on 2026-07-24'
          print('CORPORATE_ACTION_SOURCE_SMOKE_PASS')
          PY

      - name: Build Phase 1 integration payload
        if: github.event_name != 'pull_request'
        env:
          TWSE_QUOTE_CACHE_PATH: ${{ runner.temp }}/twse-quote-cache.json
        run: python stock_bridge/bridge_quote_layer_v2.py

      - name: Build Phase 2 analytics
        if: github.event_name != 'pull_request'
        run: python stock_bridge/phase2_fixed.py

      - name: Validate integration payload
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('stock_bridge/latest.json').read_text(encoding='utf-8'))
          assert data['schema_version'] == '2.0'
          assert data.get('generated_at')
          assert data.get('market_date')
          assert set(data['quotes']) == {'2002', '3019'}
          assert set(data['history']) == {'2002', '3019'}
          assert set(data['analytics']) == {'2002', '3019'}
          assert data['bridge']['analysis_ready'] is True
          cache_meta = data['bridge'].get('quote_cache') or {}
          assert cache_meta.get('mode') == 'COMBINED_DEPHASED_MIS_POLLING'
          assert cache_meta.get('combined_request') is True
          assert cache_meta.get('max_age_seconds') == 900
          allowed = {'PASS', 'FAIL_STALE_TRADE', 'FAIL_NO_RECENT_TRADE', 'FAIL_NETWORK'}
          for symbol in ('2002', '3019'):
              quote = data['quotes'][symbol]
              assert quote['status'] in allowed
              if quote['status'] == 'PASS':
                  assert quote.get('same_msgarray_verified') is True
                  assert quote.get('price') is not None
                  assert quote.get('trade_date')
                  assert quote.get('trade_time')
                  assert 0 <= quote.get('age_seconds', 10**9) <= 900
              history = data['history'][symbol]
              analytics = data['analytics'][symbol]
              assert history['count'] >= 750
              assert history['history_gate'] == 'PASS'
              assert history['long_term_750_ready'] is True
              assert history['price_adjustment_status'] == 'PASS'
              assert history['integrity_error_count'] == 0
              assert analytics['analysis_ready'] is True
              assert analytics['corporate_actions']['status'] == 'PASS'
          print('SOURCE_INTEGRATION_VALIDATION_PASS')
          print('quotes=', {k: v['status'] for k, v in data['quotes'].items()})
          print('quote_cache=', cache_meta)
          PY
