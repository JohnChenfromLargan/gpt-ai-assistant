name: TWSE Audit P0 (No Publish)

on:
  push:
    branches: ['fix/stock-audit-p0-20260907']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twse-audit-p0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/fix/stock-audit-p0-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Record exact source and run deterministic self tests only
        run: |
          mkdir -p audit-artifacts/source
          cp stock_bridge/*.py audit-artifacts/source/
          git rev-parse HEAD > audit-artifacts/commit.txt
          git ls-tree -r HEAD stock_bridge > audit-artifacts/tree.txt
          python stock_bridge/bridge.py --self-test
          python stock_bridge/bridge_quote_layer.py --self-test
          python stock_bridge/bridge_quote_layer_v2.py --self-test
          python stock_bridge/phase2_fixed.py --self-test
      - name: P0 regression tests when present
        run: |
          if test -f stock_bridge/tests/test_quality_p0.py; then
            python -m unittest discover -s stock_bridge/tests -v 2>&1 | tee audit-artifacts/tests.log
          else
            echo 'BASELINE_CAPTURE_ONLY; no P0 fixes validated' | tee audit-artifacts/tests.log
          fi
      - name: Upload verification evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-audit-p0-${{ github.run_id }}
          path: audit-artifacts/
          retention-days: 7
